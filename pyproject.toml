[project]
name = "vks-mcp"
version = "0.1.0"
description = "GreenNode MCP Server — AI assistant tools for VNG Kubernetes Service (VKS)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Green Node"},
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "kubernetes>=28.0.0,<36.0",
    "pyyaml>=6.0,<7.0",
    "cachetools>=5.3.0,<6.0",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
vks-mcp-server = "vks_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/vngcloud/greennode-mcp"
Source = "https://github.com/vngcloud/greennode-mcp"
"Bug Tracker" = "https://github.com/vngcloud/greennode-mcp/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vks_mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
