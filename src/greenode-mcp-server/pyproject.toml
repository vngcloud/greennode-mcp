[project]
name = "greenode-mcp-server"
version = "0.3.1"
description = "GreenNode MCP Server — AI assistant tools for all VNG Cloud products"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0,<1.0",
    "kubernetes>=28.0.0,<36.0",
    "pyyaml>=6.0,<7.0",
    "cachetools>=5.3.0,<6.0",
    "pydantic>=2.0.0,<3.0",
]
license = "Apache-2.0"
authors = [
    {name = "Green Node"},
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
http = [
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.4.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
greenode-mcp-server = "greennode.greenode_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/vngcloud/greennode-mcp"
Source = "https://github.com/vngcloud/greennode-mcp"
"Bug Tracker" = "https://github.com/vngcloud/greennode-mcp/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["greennode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
